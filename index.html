<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pierrot.exe!</title>
  <style>
 
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;  
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 1.125rem; 
      line-height: 1.6;    
      color: #1f1f1f;       
      background: #e9e8e6  ;
    }

    article {
      max-width: 65ch;
      margin: 0 auto; 
      padding: 4rem 1.25rem;
    }

    h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 0.5em; }
    h2 { font-size: 1.5rem;  line-height: 1.3; margin: 2em 0 0.5em; }
    p  { margin: 0 0 1.25em; } 

    .meta { color: #6b6b6b; font-size: 0.875rem; margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <header></header>

  <main>
    <article>
      <h1>Hello World!</h1>
      <p class="meta"><time datetime="2026-10-01">October 1, 2026</time></p>

      <p> Hello there... </p>

      <h2>A Subheading</h2>
      <p>Continue the body text...</p>
    </article>
  </main>

  <footer></footer>
</body>
</html>
